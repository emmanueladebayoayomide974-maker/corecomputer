<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | CoreCompute</title>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .navbar { background-color: #1e293b; border-bottom: 1px solid #334155; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; color: #38bdf8; text-decoration: none; }
        .nav-links a { color: #94a3b8; text-decoration: none; margin-left: 20px; font-weight: bold; }
        .nav-links a:hover { color: #38bdf8; }
        .container { max-width: 600px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #38bdf8; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #94a3b8; }
        input[type="text"], input[type="email"], textarea { width: 100%; padding: 12px; background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; box-sizing: border-box; font-size: 16px; }
        textarea { resize: vertical; height: 150px; }
        .submit-btn { background-color: #38bdf8; color: #0f172a; padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; width: 100%; }
        .submit-btn:hover { background-color: #0ea5e9; }
        footer { background-color: #0f172a; border-top: 1px solid #334155; text-align: center; padding: 30px 20px; margin-top: 100px; color: #64748b; font-size: 14px; }
        footer a { color: #94a3b8; text-decoration: none; margin: 0 10px; }
        footer a:hover { color: #38bdf8; }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="index.html" class="logo">CoreCompute</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="#">AI Tutorials</a>
            <a href="about.html">About</a>
        </div>
    </div>

    <div class="container">
        <h1>Contact Us</h1>
        <p>Have questions? Drop us a message below!</p>
        
        <form action="https://web3forms.com" method="POST">
        <input type="hidden" name="access_key" value="PASTE_YOUR_LONG_HEX_KEY_HERE">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label for="email">Your Email Address</label>
                <input type="email" id="email" name="email" required placeholder="john@example.com">
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" required placeholder="Type your message here..."></textarea>
            </div>
            <button type="submit" class="submit-btn">Send Message</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 CoreCompute. All rights reserved.</p>
        <p>
            <a href="privacy.html">Privacy Policy</a> | 
            <a href="terms.html">Terms of Service</a> | 
            <a href="contact.html">Contact Us</a>
        </p>
    </footer>

</body>
</html>
