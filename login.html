<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreComputer | Login Required</title>
    <style>
        body { 
            background-color: #0f172a; 
            color: #f8fafc;            
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0; 
            padding: 0; 
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        
        .login-box { 
            background: #1e293b; 
            padding: 40px 30px; 
            border-radius: 16px; 
            border: 1px solid #334155; 
            width: 90%; 
            max-width: 380px; 
            text-align: center; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
        }
        
        h2 { color: #38bdf8; margin: 0 0 10px 0; font-size: 28px; }
        p { color: #94a3b8; font-size: 14px; margin: 0 0 25px 0; line-height: 1.5; }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; color: #94a3b8; font-weight: bold; font-size: 14px; }
        input { 
            width: 100%; padding: 12px; 
            background-color: #0f172a; border: 1px solid #334155; 
            border-radius: 8px; color: #f8fafc; box-sizing: border-box; font-size: 16px; 
        }
        input:focus { border-color: #38bdf8; outline: none; }
        
        .submit-btn { 
            background-color: #38bdf8; color: #0f172a; padding: 12px 20px; 
            border: none; border-radius: 8px; font-weight: bold; font-size: 16px; 
            cursor: pointer; width: 100%; margin-top: 10px; transition: background-color 0.2s;
        }
        .submit-btn:hover { background-color: #0ea5e9; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>CoreComputer</h2>
        <p>Please sign in to unlock your developer training terminal workspace.</p>
        
        <form onsubmit="verifyUser(); return false;">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required placeholder="admin">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="submit-btn">Unlock Platform 🔓</button>
        </form>
    </div>

    <script>
        function verifyUser() {
            var user = document.getElementById("username").value;
            var pass = document.getElementById("password").value;

            // Verified static pass keys (Change these to whatever you want)
            if (user.toLowerCase() === "admin" && pass === "admin") {
                // Save session token so the homepage knows they logged in
                sessionStorage.setItem("gatekeeperUnlocked", "true");
                
                // Instantly open the index homepage file
                window.location.href = "index.html";
            } else {
                alert("Incorrect username or password! Please try again.");
            }
        }
    </script>
</body>
</html>
